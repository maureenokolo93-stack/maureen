<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:'Inter Display','Inter',sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(100deg,#050b1c 0%,#0b1a3a 38%,#3a2a3a 58%,#c98a1c 82%,#ffd56b 100%)}
.ray{position:absolute;right:40px;top:-200px;width:420px;height:1100px;background:linear-gradient(180deg,rgba(255,245,200,.95),rgba(255,215,110,.25) 70%,transparent);transform:rotate(18deg);filter:blur(30px)}
.clock{position:absolute;right:125px;top:30px;width:250px;height:250px;border-radius:50%;border:10px solid #e8b33a;background:radial-gradient(#fff8d8,#f2c457 70%,#b77b10);box-shadow:0 0 80px 30px rgba(255,210,90,.8)}
.clock .h,.clock .m{position:absolute;left:50%;bottom:50%;background:#3a2300;transform-origin:bottom center;border-radius:4px}
.clock .h{width:10px;height:70px;margin-left:-5px;transform:rotate(-2deg)}
.clock .m{width:6px;height:105px;margin-left:-3px;transform:rotate(-6deg)}
.fig{position:absolute;right:50px;bottom:0;width:400px;height:560px;border:3px dashed rgba(255,255,255,.7);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:800;text-align:center;background:rgba(0,0,0,.15);text-shadow:0 2px 6px #000}
.txt{position:absolute;left:55px;top:95px;width:640px}
.nov{font-weight:900;font-size:104px;letter-spacing:2px;line-height:1;background:linear-gradient(180deg,#fff3b0,#ffd700 45%,#b8860b);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #3a2500) drop-shadow(0 0 25px rgba(255,200,60,.6))}
.main{margin-top:18px;font-weight:900;font-size:96px;line-height:.98;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 8px 18px rgba(0,0,0,.8)}
.banner{display:inline-block;margin-top:30px;background:#d10000;color:#fff;font-weight:900;font-size:46px;padding:10px 28px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.6);border:3px solid #fff}
</style></head><body>
<div class="bg"></div><div class="ray"></div>
<div class="clock"><div class="h"></div><div class="m"></div></div>
<div class="fig">YOUR KNEELING<br>WOMAN IMAGE<br>GOES HERE</div>
<div class="txt"><div class="nov">NOVEMBER</div><div class="main">11TH-HOUR<br>MIRACLE</div><div class="banner">IT'S NOT TOO LATE</div></div>
</body></html>
